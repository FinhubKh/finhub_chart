name: Deploy API (GCP Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "api/Dockerfile"
      - "Dockerfile"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
  RUNTIME_SA: finhub-chart-api-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build & deploy Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build & push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/finhub-chart-api:${GITHUB_SHA}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/finhub-chart-api:latest"
          docker build --platform linux/amd64 -f api/Dockerfile -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --port=8000 \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=3 \
            --concurrency=40 \
            --timeout=300 \
            --cpu-boost \
            --set-env-vars="^|^FINHUB_DATA_SOURCE=r2|R2_PREFIX=xauusd|APP_ROOT=/app|CORS_ORIGINS=https://finhub-chart.vercel.app,https://chart.finhubkh.com,https://finhub-chart-bunkheang-hengs-projects.vercel.app,https://finhub-chart-sigma.vercel.app,https://finhub-chart-finhubkh-5632s-projects.vercel.app" \
            --set-secrets="R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_BUCKET=R2_BUCKET:latest,R2_ENDPOINT=R2_ENDPOINT:latest"

      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
