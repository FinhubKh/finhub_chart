# Prefer Cloud Run (GCP). Keep this file only as a fallback reference for Render.
# Auto-deploy should be disabled on Render once GCP is primary.
services:
  - type: web
    name: finhub-chart-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    branch: main
    autoDeploy: false
    buildFilter:
      paths:
        - api/**
        - Dockerfile
        - api/Dockerfile
        - render.yaml
    envVars:
      - key: FINHUB_DATA_SOURCE
        value: r2
      - key: R2_PREFIX
        value: xauusd
      - key: CORS_ORIGINS
        value: https://finhub-chart.vercel.app,https://chart.finhubkh.com
      - key: APP_ROOT
        value: /app
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
